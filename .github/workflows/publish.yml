# Publish from CI through npm Trusted Publishing (OIDC): no token, no OTP.
# One-time setup on npmjs.com:
#   package page -> Settings -> Trusted publisher -> GitHub Actions
#   user: raven3005672
#   repository: dsh-plugin-highlight-notes
#   workflow filename: publish.yml
#
# Release: bump the version, commit, then push a matching tag:
#   git tag v0.1.0 && git push origin v0.1.0

name: publish

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write # required for the OIDC exchange with npm

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The action reads packageManager from package.json; passing a version
      # here as well fails with "Multiple versions of pnpm specified".
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Trusted publishing needs npm 11.5.2+; the bundled one may be older.
      - run: npm install --global npm@latest

      - name: Check the tag matches the package version
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match package version $version" >&2
            exit 1
          fi

      # smoke loads lib/, which only exists after a build.
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm smoke

      - run: npm publish --provenance
